services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercado_ahora}
      POSTGRES_USER: ${POSTGRES_USER:-mercado_ahora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercado_ahora} -d ${POSTGRES_DB:-mercado_ahora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [./.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-mercado_ahora}
      DB_USERNAME: ${POSTGRES_USER:-mercado_ahora}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  queue:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [./.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SKIP_STARTUP_TASKS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-mercado_ahora}
      DB_USERNAME: ${POSTGRES_USER:-mercado_ahora}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=5", "--timeout=90", "--backoff=10"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [./.env.production]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SKIP_STARTUP_TASKS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-mercado_ahora}
      DB_USERNAME: ${POSTGRES_USER:-mercado_ahora}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [./.env.production]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config: